# --- CORE MICROSERVICES DEPLOYMENT ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-inference-service
  namespace: industrial-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-inference
  template:
    metadata:
      labels:
        app: ml-inference
    spec:
      containers:
      - name: ml-inference
        image: industrial/ml-inference:latest
        ports:
        - containerPort: 8000
        env:
        - name: KAFKA_BROKER
          value: "kafka-service:9092"
        - name: OTLP_ENDPOINT
          value: "http://tempo:4317"
        resources:
          limits:
            cpu: "500m"
            memory: "1Gi"
          requests:
            cpu: "200m"
            memory: "512Mi"

---
# --- KEDA AUTO-SCALING (KAFKA LAG BASED) ---
# Scales the ML service automatically when thousands of machines stream data
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kafka-scaledobject
  namespace: industrial-ai
spec:
  scaleTargetRef:
    name: ml-inference-service
  minReplicaCount: 2
  maxReplicaCount: 20
  triggers:
  - type: kafka
    metadata:
      bootstrapServers: kafka-service:9092
      topic: factory.features.realtime
      consumerGroup: ml-inference-group
      lagThreshold: "100"

---
# --- SERVICE DISCOVERY ---
apiVersion: v1
kind: Service
metadata:
  name: ml-inference-service
  namespace: industrial-ai
spec:
  selector:
    app: ml-inference
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP

---
# --- INGRESS GATEWAY (TRAEFIK) ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: industrial-ingress
  namespace: industrial-ai
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  rules:
  - host: industrial-ai.enterprise.com
    http:
      paths:
      - path: /api/v1/ml
        pathType: Prefix
        backend:
          service:
            name: ml-inference-service
            port:
              number: 80
